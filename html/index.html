<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css/main.css">
	<title>Data Science Project</title>
</head>

<body>
	<div class="container-fluid">
		<nav class="navbar navbar-expand-lg navbar-light">
			<div class="container-fluid">
				<a class="navbar-brand" href="/" title="Zur Startseite">
					<img src="../assets/images/Logo-Heimsucher.svg" alt="Logo Heimsucher">
				</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
					data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
					aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item">
							<a class="nav-link active" aria-current="page" href="#">Über das Projekt</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#">Impressum</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#">Datenschutz</a>
						</li>
					</ul>
					<button class="btn btn-primary" href="/explore">Explore</button>
				</div>
			</div>
		</nav>
	</div>

	<div class="container-fluid main-content">
		<div class="row">
			<div class="col-12 col-sm-3 sidebar">
				<div class="accordion" id="accordionFilter">
					<div class="accordion-item">
						<h2 class="accordion-header" id="headingOne">
							<button class="accordion-button" type="button" data-bs-toggle="collapse"
								data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
								Finanzen
							</button>
						</h2>
						<div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne"
							data-bs-parent="#accordionFilter">
							<div class="accordion-body">
								<div class="filter rentalPriceSliderContainer mb-3">
									<input type="checkbox" id="rentalPriceSliderCheckbox" class="checkbox" checked>
									<label for="rentalPriceSlider" class="form-label">Mietpreis</label>
									<div id="rentalPriceSlider" class="range-slider"></div>
									<div class="mt-3">
										<span id="rentalPriceSliderRangeValue"></span>
									</div>
								</div>
								<div class="filter landPriceRangesContainer mb-3 disabled">
									<input type="checkbox" id="landPriceRangesCheckbox" class="checkbox">
									<label for="landPriceRanges" class="form-label">Baulandpreise (€ pro m²)</label>
									<div id="landPriceRanges" class="btn-group d-flex">
										<button class="range-1 btn btn-secondary w-100 active" href="#">< 50</button>
										<button class="range-2 btn btn-secondary w-100 active" href="#">50 - 100</button>
										<button class="range-3 btn btn-secondary w-100 active" href="#">100 - 200</button>
										<button class="range-4 btn btn-secondary w-100 active" href="#">200 - 300</button>
										<button class="range-5 btn btn-secondary w-100 active" href="#">300 - 500</button>
										<button class="range-6 btn btn-secondary w-100 active" href="#">> 500</button>
									</div>
								</div>
								<div class="filter disposableIncomeSliderContainer mb-3 disabled">
									<input type="checkbox" id="disposableIncomeSliderCheckbox" class="checkbox">
									<label for="disposableIncomeSlider" class="form-label">Verfügbares Einkommen</label>
									<div id="disposableIncomeSlider" class="range-slider"></div>
									<div class="mt-3">
										<span id="disposableIncomeSliderRangeValue"></span>
									</div>
								</div>
								<!--
								<div class="mb-3">
									<label for="liveliehoodCostSlider" class="form-label">Lebensunterhaltungskosten</label>
									<div id="liveliehoodCostSlider" class="range-slider"></div>
									<div class="mt-3">
										<span id="liveliehoodCostSliderRangeValue"></span>
									</div>
								</div>
								-->
							</div>
						</div>
					</div>
					<div class="accordion-item">
						<h2 class="accordion-header" id="headingTwo">
							<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
								data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
								Demographie
							</button>
						</h2>
						<div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo"
							data-bs-parent="#accordionFilter">
							<div class="accordion-body">
								<div class="mb-3">
									<label for="populationDensity" class="form-label">Bevölkerungsdichte</label>
									<div id="populationDensityRanges" class="btn-group d-flex">
										<button class="range-1 btn btn-secondary w-100" href="#">Sehr Niedrig</button>
										<button class="range-2 btn btn-secondary w-100" href="#">Niedrig</button>
										<button class="range-3 btn btn-secondary w-100" href="#">Mittel</button>
										<button class="range-4 btn btn-secondary w-100" href="#">Sehr Hoch</button>
										<button class="range-5 btn btn-secondary w-100" href="#">Hoch</button>
									</div>
								</div>
								<div class="mb-3">
									<label for="unemploymentRate" class="form-label">Arbeitslosenquote</label>
									<div id="unemploymentRateRanges" class="btn-group d-flex">
										<button class="range-1 btn btn-secondary w-100" href="#">Sehr Niedrig</button>
										<button class="range-2 btn btn-secondary w-100" href="#">Niedrig</button>
										<button class="range-3 btn btn-secondary w-100" href="#">Mittel</button>
										<button class="range-4 btn btn-secondary w-100" href="#">Sehr Hoch</button>
										<button class="range-5 btn btn-secondary w-100" href="#">Hoch</button>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="accordion-item">
						<h2 class="accordion-header" id="headingThree">
							<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
								data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
								Sonstiges
							</button>
						</h2>
						<div id="collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree"
							data-bs-parent="#accordionFilter">
							<div class="accordion-body">
								<div class="form-check">
									<input class="form-check-input" type="checkbox" value="" id="leisureActivities">
									<label class="form-check-label" for="leisureActivities">
										Freizeitaktivitäten
									</label>
								</div>
							</div>
						</div>
					</div>
				</div>
				<button id="resetAllFilters" class="btn btn-primary w-100" href="#">Alle Filter löschen</button>
			</div>
			<div class="col-12 col-sm-9">
				<div id="main-map" class="map main-map"></div>
			</div>
		</div>
	</div>

	<script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
	<script src="../node_modules/d3/dist/d3.min.js"></script>
	<script src="../dist/bundle.js"></script>
</body>

</html>
